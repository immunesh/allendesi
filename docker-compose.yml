version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: Allendesi_db
    environment:
      POSTGRES_USER: Allendesi_user
      POSTGRES_PASSWORD: Allendesi_pass
      POSTGRES_DB: Allendesi_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U Allendesi_user -d Allendesi_db']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: Allendesi_backend
    environment:
      DATABASE_URL: postgresql://Allendesi_user:Allendesi_pass@postgres:5432/Allendesi_db
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      PORT: 5000
      NODE_ENV: development
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: Allendesi_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - '3000:3000'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
